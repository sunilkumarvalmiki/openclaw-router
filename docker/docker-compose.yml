version: '3.8'

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://openclaw:openclaw_secret@postgres:5432/openclaw_router
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=info
      - HOST=0.0.0.0
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - openclaw-net

  dashboard:
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXTAUTH_URL=https://sunilkumarvalmiki.xyz
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GATEWAY_URL=http://gateway:8080
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - openclaw-net

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=openclaw
      - POSTGRES_PASSWORD=openclaw_secret
      - POSTGRES_DB=openclaw_router
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclaw -d openclaw_router"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - openclaw-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - openclaw-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
    depends_on:
      - gateway
      - dashboard
    restart: unless-stopped
    networks:
      - openclaw-net

volumes:
  postgres_data:
  redis_data:
  certbot_etc:
  certbot_var:

networks:
  openclaw-net:
    driver: bridge
