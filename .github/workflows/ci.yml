name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust Gateway ────────────────────────────────────────────────
  gateway-lint:
    name: Gateway - Clippy Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gateway/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('gateway/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  gateway-test:
    name: Gateway - Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openclaw
          POSTGRES_PASSWORD: openclaw_secret
          POSTGRES_DB: openclaw_router_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openclaw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://openclaw:openclaw_secret@localhost:5432/openclaw_router_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gateway/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('gateway/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --all-features

  # ── Next.js Dashboard ──────────────────────────────────────────
  dashboard-build:
    name: Dashboard - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint 2>/dev/null || echo "Lint step skipped"
        continue-on-error: true

      - name: Build
        run: npm run build
